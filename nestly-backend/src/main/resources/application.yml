spring:
  application:
    name: nestly-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health

nestly:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  search:
    url: ${MEILISEARCH_URL:http://localhost:7700}
    api-key: ${MEILISEARCH_API_KEY}
    index: ${MEILISEARCH_INDEX:pages}
    sync-interval-ms: ${SEARCH_SYNC_INTERVAL_MS:3000}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}
    cleanup-cron: "${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}"