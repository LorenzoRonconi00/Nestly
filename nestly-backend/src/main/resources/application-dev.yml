spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/nestly
    username: ${DB_USERNAME:nestly}
    password: ${DB_PASSWORD:nestly}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

nestly:
  jwt:
    secret: ${JWT_SECRET:dev-only-not-for-production-32-chars-minimum-secret-key}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}