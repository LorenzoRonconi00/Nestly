spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/nestly
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

nestly:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  refresh-token:
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}